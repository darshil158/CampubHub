<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="quad-primary" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="quad-accent" x1="8" y1="40" x2="40" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="quad-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <rect width="48" height="48" rx="12" fill="#0F172A" />
  <rect width="46" height="46" x="1" y="1" rx="11" stroke="url(#quad-primary)" stroke-opacity="0.3" stroke-width="1" />

  <!-- Core Prism / Interlocking Quad Diamond Q -->
  <g filter="url(#quad-glow)">
    <!-- Top-left Quad facet (Academics & Tutoring) -->
    <path d="M24 8L36 18L24 24L12 18L24 8Z" fill="url(#quad-primary)" />
    <!-- Bottom-right facet (Marketplace & Jobs) -->
    <path d="M24 24L36 18L36 30L24 38L24 24Z" fill="url(#quad-primary)" fill-opacity="0.85" />
    <!-- Bottom-left facet (Housing & Community) -->
    <path d="M24 24L24 38L12 30L12 18L24 24Z" fill="url(#quad-accent)" fill-opacity="0.9" />
    <!-- Glowing Apex Spark -->
    <circle cx="24" cy="24" r="2.5" fill="#FFFFFF" />
    <!-- Tail of the Q (Action / Momentum) -->
    <path d="M30 32L38 40" stroke="#EC4899" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>